# GoReleaser configuration. Run `goreleaser check` before relying on it.
version: 2

project_name: omassh

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: omassh
    main: ./cmd/omassh
    binary: omassh
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: omassh
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

# Named explicitly so the configuration validates and releases predictably
# without depending on whatever git remote happens to be configured.
release:
  github:
    owner: cuonggt
    name: omassh

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Requires a github.com/cuonggt/homebrew-tap repository to push to.
# Casks rather than formulas: Homebrew expects pre-built binaries to ship as
# casks, and goreleaser deprecated `brews` accordingly. The generated cask
# carries URLs for all four targets; Linux users can equally take the tarball
# from the release or use `go install`.
homebrew_casks:
  - name: omassh
    repository:
      owner: cuonggt
      name: homebrew-tap
    homepage: https://github.com/cuonggt/omassh
    description: A keyboard-driven SSH client for the terminal
    # The binary is unsigned and unnotarised, and Homebrew's downloader marks
    # what it fetches with com.apple.quarantine. Without stripping it, macOS
    # refuses to run the binary with "Apple could not verify omassh is free of
    # malware" and the install looks fine right up until first use.
    #
    # Written out rather than using goreleaser's `hooks`, which still emits the
    # `postflight` stanza Homebrew has deprecated in favour of the declarative
    # `postflight_steps`. Steps run from staged_path by default, so chdir "."
    # puts the relative argument on the staged binary; args are not path
    # specs, so there is no way to name it absolutely. must_succeed is off
    # because a machine without /usr/bin/xattr has nothing to strip, and that
    # should not fail the install.
    custom_block: |
      postflight_steps do
        run "/usr/bin/xattr",
            args:         ["-dr", "com.apple.quarantine", "omassh"],
            chdir:        ".",
            must_succeed: false
      end
